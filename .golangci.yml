version: "2"
run:
  concurrency: 4
  tests: true
linters:
  default: none
  enable:
    - dogsled
    - dupl
    - dupword
    - errcheck
    - exhaustive
    - gocyclo
    - govet
    - staticcheck
    - thelper
    - tparallel
  settings:
    dogsled:
      max-blank-identifiers: 3
    dupl:
      threshold: 100
    dupword:
      keywords:
        - the
        - and
        - a
    errcheck:
      disable-default-exclusions: true
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - io/ioutil.ReadFile
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)
        - (*strings.Builder).WriteString(string)
        - (*strings.Builder).WriteRune(rune)
    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: true
      ignore-enum-members: Example.+
      ignore-enum-types: Example.+
      package-scope-only: true
      explicit-exhaustive-map: true
      explicit-exhaustive-switch: false
    forbidigo:
      forbid:
        - pattern: ^print.*$
          msg: Do not commit print statements.
    gocyclo:
      min-complexity: 25
    govet:
      enable:
        - assign
        - bools
        - buildtag
        - printf
        - structtag
        - tests
        - unmarshal
        - unreachable
        - unusedresult
        - unusedwrite
      disable-all: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
      initialisms:
        - API
        - ASCII
        - DB
        - EOF
        - GUID
        - HTML
        - HTTP
        - HTTPS
        - ID
        - JSON
        - UI
        - URI
        - URL
        - UUID
        - XML
      dot-import-whitelist:
        - mimic
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - funlen
          - gocyclo
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 25
  max-same-issues: 5
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: false
      rewrite-rules:
        - pattern: interface{}
          replacement: any
        - pattern: a[b:len(a)]
          replacement: a[b:]
        - pattern: make(map[a]b, 0)
          replacement: make(map[a]b)
        - pattern: make([]a)
          replacement: make([]a, 0)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - _test\.go
